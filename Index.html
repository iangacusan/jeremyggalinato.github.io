<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Brew Coffee</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #4b2e2e;
      color: white;
      padding: 15px;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      background: #6f4e37;
    }

    nav a {
      color: white;
      padding: 14px 20px;
      text-decoration: none;
    }

    nav a:hover {
      background: #4b2e2e;
    }

    .hero {
      background: url('https://images.unsplash.com/photo-1509042239860-f550ce710b93') no-repeat center/cover;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
      font-weight: bold;
    }

    .container {
      padding: 20px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      text-align: center;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .btn {
      margin-top: 10px;
      padding: 10px;
      background: #6f4e37;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    .btn:hover {
      background: #4b2e2e;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #4b2e2e;
      color: white;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>☕ Cozy Brew Coffee</h1>
  <p>Your daily dose of happiness</p>
</header>

<nav>
  <a href="#home">Home</a>
  <a href="#menu">Menu</a>
  <a href="#contact">Contact</a>
</nav>

<div class="hero" id="home">
  Freshly Brewed Coffee
</div>

<div class="container">
  <h2 id="menu">Our Menu</h2>
  <div class="menu">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348">
      <h3>Espresso</h3>
      <p>₱120</p>
      <button class="btn" onclick="order('Espresso')">Order</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1498804103079-a6351b050096">
      <h3>Latte</h3>
      <p>₱150</p>
      <button class="btn" onclick="order('Latte')">Order</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1461023058943-07fcbe16d735">
      <h3>Cappuccino</h3>
      <p>₱140</p>
      <button class="btn" onclick="order('Cappuccino')">Order</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93">
      <h3>Mocha</h3>
      <p>₱160</p>
      <button class="btn" onclick="order('Mocha')">Order</button>
    </div>

  </div>
</div>

<div class="container" id="contact">
  <h2>Contact Us</h2>
  <p>Email: cozybrew@gmail.com</p>
  <p>Phone: 09123456789</p>
</div>

<footer>
  <p>© 2026 Cozy Brew Coffee</p>
</footer>

<script>
  function order(item) {
    alert("You ordered: " + item + " ☕");
  }
</script>

</body>
</html>
